name: build-and-deploy

# push 到 prd/prd 分支且涉及前后端代码时触发生产部署；main 为开发分支不部署。
# 全程跑在云服务器的 self-hosted runner 上：构建与部署同机完成，无跨境上传
# （原 GitHub 境外 runner → 国内服务器 scp 上传 jar 需 6 分钟+，是部署瓶颈）。
# runner 安装与工具链预置见 deploy/README.md 第 5 节。
on:
  push:
    branches: ['prd/prd']
    paths:
      - 'server/**'
      - 'web/**'
      - '.github/workflows/deploy.yml'

# 连续推送时取消进行中的旧部署：4G 内存机器，避免两个构建同时跑
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 服务器已预装 JDK17/Maven/Node20（apt），依赖缓存在 runner 本机 ~/.m2 与 ~/.npm，
      # 天然持久化，无需 setup-java/setup-node/cache 步骤
      - name: Build server jar
        working-directory: server
        env:
          MAVEN_OPTS: -Xmx512m    # 限 Maven 堆：与后端服务(1G)+PG 共存于 4G 内存
        run: mvn -B clean package -DskipTests

      - name: Build web dist
        working-directory: web
        run: npm ci && npm run build

      # 同机部署：本地拷贝替代原 scp-action + ssh-action（不再需要 GitHub Secrets）
      - name: Deploy and restart
        run: |
          sudo cp server/target/meng-x-server.jar /opt/meng-x/meng-x-server.jar
          sudo cp -r web/dist/. /var/www/meng-x/
          sudo systemctl restart meng-x
          sleep 3
          systemctl is-active meng-x
