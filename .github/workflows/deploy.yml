name: build-and-deploy

# push 到 prd/prd 分支且涉及前后端代码时触发生产部署；main 为开发分支不部署
on:
  push:
    branches: ['prd/prd']
    paths:
      - 'server/**'
      - 'web/**'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 构建后端 ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: server/pom.xml

      - name: Build server jar
        working-directory: server
        run: mvn -B clean package -DskipTests

      # ---------- 构建前端 ----------
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web dist
        working-directory: web
        run: npm ci && npm run build

      # ---------- 部署到云服务器 ----------
      # 需在仓库 Settings → Secrets and variables → Actions 配置:
      #   SERVER_HOST     服务器公网 IP
      #   SERVER_USER     部署用户（server-setup.sh 创建的 mengx）
      #   SERVER_SSH_KEY  部署私钥（与服务器 authorized_keys 中的公钥配对）
      - name: Upload server jar
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: server/target/meng-x-server.jar
          target: /opt/meng-x/
          strip_components: 2

      - name: Upload web dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: web/dist/*
          target: /var/www/meng-x/
          strip_components: 2

      - name: Restart backend service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart meng-x
            sleep 3
            sudo systemctl status meng-x --no-pager | head -n 5
