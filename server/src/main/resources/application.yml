server:
  port: 8080

spring:
  application:
    name: meng-x-server
  config:
    # 自动导入本地密钥配置：文件存在即生效，无需 profile；生产 jar 不含该文件，自动跳过
    import: optional:classpath:application-local.yml
  datasource:
    # 默认值面向本地开发；生产由服务器 /opt/meng-x/meng-x.env 注入覆盖
    url: ${MENGX_DB_URL:jdbc:postgresql://localhost:5432/mengx}
    username: ${MENGX_DB_USER:mengx}
    password: ${MENGX_DB_PASSWORD:mengx_local_pwd}
  jpa:
    hibernate:
      ddl-auto: update    # MVP 阶段自动建表；正式上线前建议改 validate + Flyway 迁移
    open-in-view: false

mengx:
  jwt:
    # 开发默认值；生产必须经环境变量注入（server-setup.sh 已随机生成）
    secret: ${MENGX_JWT_SECRET:meng-x-dev-secret-0123456789abcdef0123456789}
    ttl-hours: 168        # token 有效期 7 天
  law:
    # 法学 RAG 数据源根目录：其下应有 Laws/（LawRefBook/Laws 克隆）。本地默认指向项目旁目录；
    # 生产由服务器 /opt/meng-x/meng-x.env 注入 MENGX_LAW_DATA_DIR
    data-dir: ${MENGX_LAW_DATA_DIR:D:/code/project}
    # 法考真题库根目录：其下应有 客观题/ 与 客观题-答案解析/ 两个 markdown 目录。
    # 本地 → application-local.yml；生产 → 服务器 meng-x.env 注入 MENGX_LAW_QUESTION_DIR
    question-dir: ${MENGX_LAW_QUESTION_DIR:}
    # RAG 向量（OpenAI 兼容 /embeddings）：千问 MaaS qwen3.7-text-embedding-flash，1024 维
    # 与 law_* 表 DDL 的 vector(1024) 一致；api-key 不入库：
    # 本地 → application-local.yml；生产 → 服务器 meng-x.env 注入 MENGX_EMBEDDING_API_KEY
    embedding-model: qwen3.7-text-embedding-flash
    embedding-dimension: 1024
    embedding-base-url: ${MENGX_EMBEDDING_BASE_URL:https://maas.qianwenaiapi.com/compatible-mode/v1}
    embedding-api-key: ${MENGX_EMBEDDING_API_KEY:}
# 智谱 GLM。api-key 不入库：
# 本地开发 → src/main/resources/application-local.yml（已 gitignore，spring.config.import 自动加载）
# 生产   → 服务器 /opt/meng-x/meng-x.env 的 MENGX_LLM_API_KEY
ai:
  model:
    # zhipu 官方客户端在主机根后自行拼接 api/paas/v4/...，base-url 只填主机根；
    # open-ai 兼容客户端（host/agent 档）需完整端点，由 AiModelConfig 拼接
    base-url: https://open.bigmodel.cn/
    api-key: ${MENGX_LLM_API_KEY:}
    # 三档分工：host=前台主对话（Host function calling 路由 + 直答；法学助手/共创顾问共用流式档）；
    # agent=内部结构化（共创推演/观察器/装配器/PRD 格式化器）；route=意图路由等轻量二分类。
    # host 用 glm-5.3-flash：glm-4-flash 免费档实测无视注入的路由指令（session 153 同 payload
    # 四连逃逸直答），5.3-flash 重放四连服从；host/agent 均为强制思考模型，经 langchain4j-open-ai
    # 走智谱 OpenAI 兼容端点（同 key），思考强度 reasoning_effort 降档（low 实测 FC 决策轮
    # 仅思考 ~5 token）；route 档 4-flash 非思考，沿用 zhipu 客户端。
    # 思考 token 计入 completion，host/agent 档 max-tokens 留足防截断
    host-name: glm-5.3-flash
    host-temperature: 0.7
    host-max-tokens: 4096
    host-reasoning-effort: low
    # host 流式并发闸：流式请求自发出至流结束全程占一路；15 路内直通、超出排队
    # （多用户高峰下排队等待优于直接 429 空回复），留 5 路给路由档与重试
    host-concurrency-permits: 15
    host-acquire-timeout-seconds: 60
    agent-name: glm-5.3-flash
    agent-temperature: 0.2
    agent-max-tokens: 8192
    agent-reasoning-effort: low
    route-name: glm-4-flash
    route-temperature: 0.1
    route-max-tokens: 256
    route-thinking: disabled
    timeout-seconds: 60

# 可观测性（零新增容器）：指标走本机 9913 管理端口（Nginx 只转发 /api，公网不可达），
# tracing 全采样，traceId/spanId 随每行日志输出（跨环节 grep 定位问题）
management:
  server:
    port: 9913          # 独立管理端口：与主应用隔离，主应用安全链不适用
    address: 127.0.0.1  # 仅本机可访问
  endpoints:
    web:
      exposure:
        include: health,prometheus
  tracing:
    sampling:
      probability: 1.0  # 信任圈小流量，全采样

logging:
  pattern:
    level: "%5p [%X{traceId:-},%X{spanId:-}]"
